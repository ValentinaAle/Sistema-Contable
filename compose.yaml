services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-economia_db}
      MYSQL_USER: ${MYSQL_USER:-contable}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-contable_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/06_balance_cierre.sql:/docker-entrypoint-initdb.d/06_balance_cierre.sql:ro
      - ./sql/07_orden_rt8_rubros.sql:/docker-entrypoint-initdb.d/07_orden_rt8_rubros.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-economia_db}
      DB_USER: ${MYSQL_USER:-contable}
      DB_PASSWORD: ${MYSQL_PASSWORD:-contable_dev}
      DISPLAY: :0
    ports:
      - "${APP_PORT:-6080}:6080"

volumes:
  mysql_data:
